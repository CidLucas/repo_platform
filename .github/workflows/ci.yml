name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.mdx'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.mdx'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.14.11
      - name: Run ruff
        run: ruff check --output-format=github .

  dep-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          for f in $(find . -name "pyproject.toml" -not -path "*/node_modules/*" -not -path "./langfuse/*" -not -path "./.venv/*"); do
            python3 -c "import tomllib; tomllib.load(open('$f', 'rb'))" || exit 1
            echo "  OK $f"
          done

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [lint, dep-check]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - atendente_core
          - tool_pool_api
        include:
          - service: atendente_core
            source_dir: agent_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Cache venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: services/${{ matrix.source_dir || matrix.service }}/.venv
          key: venv-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles(format('services/{0}/poetry.lock', matrix.source_dir || matrix.service)) }}
      - name: Install deps
        working-directory: services/${{ matrix.source_dir || matrix.service }}
        run: poetry install --with dev --no-interaction
      - name: Run tests
        working-directory: services/${{ matrix.source_dir || matrix.service }}
        run: poetry run pytest tests/ -v --timeout=120

  docker-build:
    name: Build Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          - atendente_core
          - tool_pool_api
          - blu_dashboard
        include:
          - service: blu_dashboard
            dockerfile_path: apps/blu_dashboard/Dockerfile
          - service: atendente_core
            dockerfile_path: services/agent_api/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        env:
          DOCKERFILE_PATH: ${{ matrix.dockerfile_path || format('services/{0}/Dockerfile', matrix.service) }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f "${DOCKERFILE_PATH}" \
            --load \
            -t "blu-${{ matrix.service }}:ci" \
            .
          echo "Image built: blu-${{ matrix.service }}:ci"
