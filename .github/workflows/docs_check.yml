name: Docs Check

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          for lib in blu_tool_registry blu_agent_framework; do
            pip install -e "libs/$lib" --quiet
          done
      - run: python scripts/generate_agent_docs.py --check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-diff
          path: docs/system_reference/
