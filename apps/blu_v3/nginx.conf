# apps/blu_v3/nginx.conf
# Configuração Nginx para servir o frontend Blu (blu_v3) em produção.
# Gera o build com: npm run build  (tsc -b && vite build)
# SPA fallback: todas as rotas → /index.html

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Gzip ────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/xml text/xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Security Headers ────────────────────────────────────────────────
    add_header X-Frame-Options         "DENY"              always;
    add_header X-Content-Type-Options  "nosniff"           always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ══════════════════════════════════════════════════════════════════════
    # Content-Security-Policy (produção)
    # ══════════════════════════════════════════════════════════════════════
    # NOTA: o index.html também tem um <meta> CSP — o browser aplica a
    # INTERSEÇÃO dos dois. Mantenha ambos alinhados ao mudar qualquer um.
    #
    # default-src 'self'              → só carrega recursos da mesma origem
    # style-src 'unsafe-inline'       → necessário para CSS-in-JS e estilos inline
    # script-src apis/accounts.google → Google Picker (gapi) + OAuth
    # connect-src                     → Supabase REST/WS + APIs no Cloud Run
    #                                   (agent-api, tool-pool-api) + Google APIs
    # img-src googleusercontent       → avatares de conta Google
    # frame-src docs/accounts.google  → iframe do Google Picker + OAuth
    # frame-ancestors 'none'          → protege contra clickjacking
    # base-uri 'self'                 → protege contra injeção de <base>
    # form-action 'self'              → formulários só para mesma origem
    # ══════════════════════════════════════════════════════════════════════
    add_header Content-Security-Policy "
        default-src 'self';
        style-src   'self' 'unsafe-inline';
        script-src  'self' https://apis.google.com https://accounts.google.com;
        connect-src 'self'
            https://haruewffnubdgyofftut.supabase.co
            wss://haruewffnubdgyofftut.supabase.co
            https://agent-api-960100281317.southamerica-east1.run.app
            https://tool-pool-api-960100281317.southamerica-east1.run.app
            https://*.googleapis.com
            https://accounts.google.com;
        img-src     'self' data: blob: https://*.googleusercontent.com;
        font-src    'self';
        frame-src   'self' https://docs.google.com https://accounts.google.com;
        frame-ancestors 'none';
        base-uri    'self';
        form-action 'self';
    " always;

    # ── Static assets com cache agressivo (conteúdo hashed pelo Vite) ──
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ── Favicon / robots / arquivos estáticos do public/ ────────────────
    location ~* \.(ico|svg|png|jpg|jpeg|webp|txt|xml|json)$ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ────────────────────────────────────────────────────
    # Qualquer rota que não seja um arquivo existente → index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Não cachear o HTML principal (sempre buscar versão fresca)
        add_header Cache-Control "no-cache, must-revalidate";

        # ⚠️ Gotcha do nginx: um add_header no location DESCARTA todos os
        # add_header herdados do server. Como este location tem o
        # Cache-Control acima, os security headers precisam ser repetidos
        # aqui — é a resposta do documento (HTML), onde o CSP é aplicado.
        # Mantenha alinhado com o bloco do server e com o <meta> CSP do
        # index.html.
        add_header X-Frame-Options         "DENY"              always;
        add_header X-Content-Type-Options  "nosniff"           always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "
            default-src 'self';
            style-src   'self' 'unsafe-inline';
            script-src  'self' https://apis.google.com https://accounts.google.com;
            connect-src 'self'
                https://haruewffnubdgyofftut.supabase.co
                wss://haruewffnubdgyofftut.supabase.co
                https://agent-api-960100281317.southamerica-east1.run.app
                https://tool-pool-api-960100281317.southamerica-east1.run.app
                https://*.googleapis.com
                https://accounts.google.com;
            img-src     'self' data: blob: https://*.googleusercontent.com;
            font-src    'self';
            frame-src   'self' https://docs.google.com https://accounts.google.com;
            frame-ancestors 'none';
            base-uri    'self';
            form-action 'self';
        " always;
    }

    # ── Health check (Cloud Run) ────────────────────────────────────────
    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ── Logs ────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;
}
