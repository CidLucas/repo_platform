server {
    listen ${PORT};
    server_name _;

    resolver 127.0.0.11 valid=10s;
    set $dashboard http://vizu_dashboard:8080;

    root /usr/share/nginx/html;
    index index.html;

    # Landing page - exact root only
    location = / {
        try_files /index.html =404;
    }

    # Onboarding flow (SPA, lives in the landing bundle)
    location /onboarding {
        try_files /index.html =404;
    }
    location /onboarding/ {
        try_files /index.html =404;
    }

    # Landing static assets (Vite assetsDir: 'landing-assets')
    location /landing-assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon and other landing root files
    location ~* ^/[^/]+\.(ico|png|svg|webmanifest)$ {
        try_files $uri @dashboard;
    }

    # Named fallback used by try_files for assets that belong to the dashboard app.
    location @dashboard {
        proxy_pass $dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else goes to the dashboard SPA
    location / {
        proxy_pass $dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
