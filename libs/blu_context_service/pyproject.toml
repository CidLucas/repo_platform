[tool.poetry]
name = "blu_context_service"
version = "0.1.0"
description = "Lib agnóstica para prover contexto de cliente (DB) e cache (Redis)"
authors = ["Lucas Cid <lucas@blubr.com>"]
readme = "README.md"
packages = [{include = "blu_context_service", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Dependências de produção
redis = "^5.0.0"
# Dependências locais
blu_models = {path = "../../libs/blu_models", develop = true}
blu_supabase_client = {path = "../../libs/blu_supabase_client", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-mock = "^3.12.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0" # Para testes de dependências FastAPI

# Configuração de PYTHONPATH para testes (conforme Manual de Boas Práticas Blu Deploy)
ruff = "^0.14.7"
fastapi = "^0.136.1"
pydantic-settings = "^2.14.1"
[tool.pytest.ini_options]
pythonpath = [
    "src",
    "../../libs"
]
