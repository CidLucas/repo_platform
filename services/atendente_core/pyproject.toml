[tool.poetry]
name = "atendente-core"
version = "0.1.0"
description = "API responsável por orquestrar a lógica conversacional em tempo real (Core)."
authors = ["Lucas Cid <lucas@blubr.com>"]
packages = [{include = "atendente_core", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic-settings = "^2.2.1"

# === DEPENDÊNCIAS LANGCHAIN ===
# Core dependencies (langgraph pulls these transitively)
langgraph = "^0.2"
langgraph-checkpoint-redis = "^0.1.3"

# MCP transport - direct dependency for mcp_client.py
mcp = ">=1.9.0"
langchain-mcp-adapters = "^0.1.13"

# Observabilidade via Langfuse v3 (OTEL-native)
langfuse = ">=4.0.0"

# Service-specific dependencies
redis = "^5.0.4"

# --- Dependências internas do monorepo Blu (apenas as usadas diretamente) ---
blu-auth = { path = "../../libs/blu_auth", develop = true }
blu-observability-bootstrap = { path = "../../libs/blu_observability_bootstrap" }
blu-db-connector = { path = "../../libs/blu_db_connector" }
blu-models = { path = "../../libs/blu_models", develop = true }
blu-context-service = {path = "../../libs/blu_context_service", develop = true}
blu-llm-service = {path = "../../libs/blu_llm_service", develop = true}
blu-hitl-service = {path = "../../libs/blu_hitl_service", develop = true}
blu-tool-registry = {path = "../../libs/blu_tool_registry", develop = true}
blu-prompt-management = {path = "../../libs/blu_prompt_management", develop = true}
blu-elicitation-service = {path = "../../libs/blu_elicitation_service", develop = true}
blu-agent-framework = {path = "../../libs/blu_agent_framework", develop = true}
blu-sql-factory = {path = "../../libs/blu_sql_factory", develop = true}
blu-twilio-client = {path = "../../libs/blu_twilio_client", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.4.4"
fakeredis = "^2.32.0"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"