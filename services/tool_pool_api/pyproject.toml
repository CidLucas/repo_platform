[tool.poetry]
name = "tool_pool_api"
version = "0.1.0"
description = "Serviço MCP da Blu que atua como um pool de ferramentas agnóstico ao cliente."
authors = ["Lucas Cid <lucas@blubr.com>"]
readme = "README.md"
packages = [{ include = "tool_pool_api", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"

# --- Core MCP/FastAPI ---
fastapi = "^0.115.13"
uvicorn = { extras = ["standard"], version = "^0.34.3" }
pydantic-settings = "^2.3.4"
fastmcp = "^2.11.0"
anyio = "^4.1.1"
redis = "^5.0.0"
httpx = "^0.28.1"
langfuse = ">=4.0.0"
langchain = "^0.3.0"  # Required for langfuse.langchain integration
duckdb = "^1.1.0"  # In-process analytical SQL engine for CSV queries
reportlab = "^4.2.5"  # Phase 4 (R4.1) — PDF report rendering
openpyxl = "^3.1.5"   # Phase 4 (R4.1) — XLSX report rendering

# --- Internal libs (only direct dependencies) ---
blu-models = { path = "../../libs/blu_models", develop = true }
blu-db-connector = { path = "../../libs/blu_db_connector", develop = true }
blu-context-service = { path = "../../libs/blu_context_service", develop = true }
blu-auth = { path = "../../libs/blu_auth", develop = true }
blu-observability-bootstrap = { path = "../../libs/blu_observability_bootstrap" }
blu-llm-service = { path = "../../libs/blu_llm_service", develop = true }
blu-rag-factory = { path = "../../libs/blu_rag_factory", develop = true }
blu-sql-factory = { path = "../../libs/blu_sql_factory", develop = true }
blu-tool-registry = { path = "../../libs/blu_tool_registry", develop = true }
blu-prompt-management = { path = "../../libs/blu_prompt_management", develop = true }
blu-google-suite-client = { path = "../../libs/blu_google_suite_client", develop = true }
blu-parsers = { path = "../../libs/blu_parsers", develop = true }
blu-elicitation-service = { path = "../../libs/blu_elicitation_service", develop = true }
blu-agent-framework = { path = "../../libs/blu_agent_framework", develop = true }
blu-supabase-client = { path = "../../libs/blu_supabase_client", develop = true }
blu-twilio-client = { path = "../../libs/blu_twilio_client", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.14.0"
ruff = "^0.5.0"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]